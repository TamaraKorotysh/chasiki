<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Часики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6e5; --card:#ffffff; --ink:#2b2d42; --muted:#6b6f80; --line:#f1e2c4;
  --accent:#ffd166; --good:#06d6a0; --bad:#ef476f;
  --hour:#e63958; --minute:#118ab2; --second:#2a9d4b;
  --sh:0 5px 0 rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1e2033; --card:#2b2e45; --ink:#f5f1e6; --muted:#b3b6cc; --line:#3a3e5c; --sh:0 5px 0 rgba(0,0,0,.3); }
}
:root[data-theme="dark"]{ --bg:#1e2033; --card:#2b2e45; --ink:#f5f1e6; --muted:#b3b6cc; --line:#3a3e5c; --sh:0 5px 0 rgba(0,0,0,.3); }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
header h1{flex:1;font-size:21px;margin:0;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:none;background:var(--card);border-radius:14px;min-width:46px;height:46px;font-size:22px;box-shadow:var(--sh);cursor:pointer;padding:0 8px}
.ib.off{opacity:.45}
main{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.btn{font-weight:900;font-size:20px;border:none;border-radius:18px;padding:14px 22px;background:var(--accent);color:#2b2d42;box-shadow:0 5px 0 rgba(0,0,0,.15);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.sec{background:var(--card);color:var(--ink)}
.btn.go{background:var(--good);color:#073b2c}
.btn.sm{font-size:17px;padding:10px 14px;border-radius:14px}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr);gap:14px}}
.clockcol{display:flex;justify-content:center;position:relative}
.clockbox{width:100%;max-width:min(440px,56vh);position:relative}
svg.clock{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
svg.clock.drag{cursor:grab}
svg.clock.numclick .num{cursor:pointer}
.rim{fill:#ffd166}
.face{fill:#fffdf6}
.tk{stroke:#9a9cab;stroke-width:1.4}
.tk5{stroke:#2b2d42;stroke-width:3.2;stroke-linecap:round}
.nt{fill:#2b2d42;font-size:24px;font-weight:900;text-anchor:middle;dominant-baseline:central;font-family:'Nunito',system-ui,sans-serif}
.nb{fill:transparent;transition:fill .2s}
.num.glow .nb{fill:#ffd166}
.num.done .nb{fill:#b8f2dc}
.num.bad .nb{fill:#ffc2cf}
.rl{fill:#0b5e7a;font-size:11px;font-weight:900;text-anchor:middle;dominant-baseline:central;font-family:'Nunito',system-ui,sans-serif}
.sector{fill:rgba(17,138,178,.17)}
.sector.s{fill:rgba(42,157,75,.18)}
.hand line{stroke-linecap:round}
.hh line{stroke:var(--hour);stroke-width:11}
.mh line{stroke:var(--minute);stroke-width:6.5}
.sh line{stroke:var(--second);stroke-width:2.2}
.sh circle{fill:var(--second)}
.cap{fill:#2b2d42}.cap2{fill:var(--second)}
.bubble{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh)}
.owl{font-size:46px;line-height:1;flex:none}
.masc{width:62px;height:auto;flex:none;overflow:visible}
.masc.lg{width:110px}.masc.xl{width:140px}
@media (max-width:360px){.hero .masc.xl{width:100px}}
.masc .eyes{transform-origin:50px 53px;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.masc .m-joy,.masc .m-oops{display:none}
.masc.joy .m-smile,.masc.oops .m-smile{display:none}
.masc.joy .m-joy{display:inline}.masc.oops .m-oops{display:inline}
.masc .bells{transform-origin:50px 20px}
.masc.joy .bells{animation:ring .12s linear 6}
.masc.joy{animation:hop .5s ease-out}
.masc .wave{transform-origin:17px 58px;animation:wave 2.6s ease-in-out infinite}
@keyframes ring{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes hop{40%{transform:translateY(-10px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-16deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-12deg)}}
.harc{fill:rgba(230,57,88,.14)}
.r24{fill:#7a4fd0;font-size:12.5px;font-weight:900;text-anchor:middle;dominant-baseline:central;font-family:'Nunito',system-ui,sans-serif}
.clockcol{flex-direction:column;align-items:center;gap:12px}
.daybar{width:100%;max-width:440px}
.daybar .track{position:relative;height:30px;border-radius:15px;overflow:hidden;display:flex;box-shadow:var(--sh)}
.daybar .track i{display:block;height:100%}
.daybar .mk{position:absolute;top:26px;width:4px;height:38px;background:#2b2d42;border-radius:2px;transform:translateX(-2px);transition:left .25s}
.daybar .mk::after{content:attr(data-e);position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:24px}
.daybar .wrap{position:relative;padding-top:30px}
.daybar .lb{display:flex;justify-content:space-between;font-weight:900;font-size:14px;color:var(--muted);margin-top:4px}
.daybar .nm{display:flex;font-weight:800;font-size:13px;margin-top:2px;color:var(--muted)}
.daybar .nm span{text-align:center}
.fb .sub{display:block;font-size:17px;font-weight:700;color:var(--muted);margin-top:6px}
.bubble .txt{flex:1;min-width:0}
.q{font-size:23px;font-weight:800;line-height:1.35}
.big{font-size:46px;font-weight:900;color:var(--minute);line-height:1.15}
.big:empty{display:none}
.say{flex:none;border:none;background:var(--bg);border-radius:14px;width:48px;height:48px;font-size:24px;cursor:pointer}
.fb{min-height:30px;margin-top:12px;font-size:20px;font-weight:800;line-height:1.35}
.fb.ok{color:#05a37a}.fb.no{color:var(--bad)}
.actions{margin-top:16px}
.dots{display:flex;gap:8px;justify-content:center;margin:2px 0 14px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--accent);transform:scale(1.2)}
.dot.ok{background:var(--good)}.dot.meh{background:#ffb4c4}
.stage.wide{grid-template-columns:minmax(0,1fr);max-width:900px;margin:0 auto}
.stage.wide .minis{max-width:900px}
.stage.wide .clockcol{order:2}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:640px}
.mini{background:var(--card);border-radius:20px;padding:6px;border:5px solid transparent;cursor:pointer;box-shadow:var(--sh)}
.mini.ok{border-color:var(--good)}.mini.no{border-color:var(--bad);opacity:.6}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.opt{border:5px solid transparent;background:var(--card);border-radius:20px;padding:14px 6px;font-size:34px;font-weight:900;cursor:pointer;box-shadow:var(--sh);touch-action:manipulation}
.opt small{display:block;font-size:16px;font-weight:800;color:var(--muted);margin-top:4px}
.opt.ok{border-color:var(--good)}.opt.no{border-color:var(--bad);opacity:.6}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pulse{animation:pulse 1s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.06)}}
.badge{position:absolute;top:0;left:0;background:var(--card);border-radius:16px;padding:6px 12px;font-size:20px;font-weight:900;box-shadow:var(--sh)}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;background:var(--bg);border-radius:50%}
/* map */
.hero{display:flex;gap:14px;align-items:center;margin:6px 0 18px}
.hero .owl{font-size:64px}
.hero h2{margin:0;font-size:clamp(20px,5.6vw,28px);font-weight:900}
.hero p{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:none;border-radius:22px;padding:16px 12px 14px;box-shadow:var(--sh);cursor:pointer;text-align:center;touch-action:manipulation}
.card .em{font-size:48px;line-height:1.1}
.card .tt{font-size:18px;font-weight:900;margin-top:6px;line-height:1.2}
.card .st{font-size:18px;margin-top:6px;letter-spacing:2px;color:#f4a100}
.card .n{position:absolute;top:10px;left:12px;background:var(--accent);color:#2b2d42;border-radius:50%;width:30px;height:30px;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.card.locked{opacity:.5}
.card.next{outline:4px solid var(--accent);outline-offset:2px}
h3{font-size:22px;margin:26px 0 12px;font-weight:900}
.small{color:var(--muted);font-size:15px;font-weight:700}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-weight:700;font-size:15px;padding:6px 0}
.steps{display:flex;gap:6px;margin-top:12px}
.steps i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.result{text-align:center;padding-top:30px}
.result .stars{font-size:72px;letter-spacing:6px}
.result .stars .e{filter:grayscale(1);opacity:.3}
.result h2{font-size:30px;margin:10px 0 24px}
.result .row{justify-content:center}
.tog{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tog button{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;font-weight:800;font-size:16px;cursor:pointer}
.tog button.on{border-color:var(--minute);background:rgba(17,138,178,.12)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-weight:800;font-size:16px}
.legend span::before{content:"";display:inline-block;width:26px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle;background:currentColor}
.fly{position:fixed;z-index:50;font-size:34px;pointer-events:none;animation:fly 1.3s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r));opacity:0}}
</style>
</head>
<body>
<header>
  <button class="ib" id="homeBtn" title="На карту">🗺️</button>
  <h1 id="title">Часики</h1>
  <button class="ib" id="sndBtn" title="Звуки">🔔</button>
  <button class="ib" id="voiceBtn" title="Голос">🗣️</button>
</header>
<main id="view"></main>

<script>
/* ===================== Хранилище ===================== */
const KEY='chasiki.v1';
const S=(()=>{const d={g:{},all:false,sound:true,voice:true,seen:{}};try{return Object.assign(d,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return d}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===================== Утилиты ===================== */
const $=(s,r=document)=>r.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const H=(h,m=0,s=0)=>((((h%12)+12)%12)*3600+m*60+s);
const norm=T=>((Math.round(T)%43200)+43200)%43200;
const hOf=T=>Math.floor(norm(T)/3600)%12||12;
const mOf=T=>Math.floor(norm(T)/60)%60;
const fmt=T=>hOf(T)+':'+String(mOf(T)).padStart(2,'0');

/* ===================== Талисман: будильник Динь-дилинь ===================== */
function mascot(cls=''){return `<svg class="masc ${cls}" viewBox="0 0 100 112" aria-label="Динь-дилинь">
 <g class="bells"><path d="M30 13 Q50 1 70 13" stroke="#2b2d42" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="6" r="4" fill="#2b2d42"/>
  <path d="M10 34 A16 16 0 0 1 36 14 Z" fill="#ffd166" stroke="#d99a00" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M90 34 A16 16 0 0 0 64 14 Z" fill="#ffd166" stroke="#d99a00" stroke-width="2.5" stroke-linejoin="round"/></g>
 <path d="M38 90 L34 103" stroke="#2b2d42" stroke-width="4.5" stroke-linecap="round"/><path d="M62 90 L66 103" stroke="#2b2d42" stroke-width="4.5" stroke-linecap="round"/>
 <ellipse cx="30" cy="104.5" rx="8" ry="4.5" fill="#2b2d42"/><ellipse cx="70" cy="104.5" rx="8" ry="4.5" fill="#2b2d42"/>
 <g class="wave"><path d="M17 58 Q5 50 8 36" stroke="#e63958" stroke-width="5.5" fill="none" stroke-linecap="round"/><circle cx="8" cy="34" r="5" fill="#fffdf6" stroke="#2b2d42" stroke-width="2"/></g>
 <path d="M83 62 Q95 68 89 78" stroke="#e63958" stroke-width="5.5" fill="none" stroke-linecap="round"/><circle cx="87" cy="80" r="5" fill="#fffdf6" stroke="#2b2d42" stroke-width="2"/>
 <circle cx="50" cy="58" r="36" fill="#e63958" stroke="#b8263f" stroke-width="3"/>
 <circle cx="50" cy="58" r="28" fill="#fffdf6"/>
 <g fill="#2b2d42"><circle cx="50" cy="34" r="2.2"/><circle cx="74" cy="58" r="2.2"/><circle cx="50" cy="82" r="2.2"/><circle cx="26" cy="58" r="2.2"/></g>
 <g class="eyes"><ellipse cx="41" cy="52" rx="4.2" ry="5.2" fill="#2b2d42"/><ellipse cx="59" cy="52" rx="4.2" ry="5.2" fill="#2b2d42"/>
  <circle cx="42.6" cy="50.2" r="1.6" fill="#fff"/><circle cx="60.6" cy="50.2" r="1.6" fill="#fff"/></g>
 <circle cx="34" cy="62" r="4" fill="#ffb3c1"/><circle cx="66" cy="62" r="4" fill="#ffb3c1"/>
 <path class="m-smile" d="M42 63 Q50 71 58 63" stroke="#2b2d42" stroke-width="3" fill="none" stroke-linecap="round"/>
 <path class="m-joy" d="M41 62 Q50 76 59 62 Z" fill="#2b2d42" stroke="#2b2d42" stroke-width="2" stroke-linejoin="round"/>
 <path class="m-oops" d="M44 68 Q50 63 56 68" stroke="#2b2d42" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`}
let moodT=null;
function mood(m){document.querySelectorAll('.bubble .masc,.result .masc').forEach(e=>{e.classList.remove('joy','oops');void e.getBoundingClientRect();if(m)e.classList.add(m)});
  clearTimeout(moodT);if(m)moodT=setTimeout(()=>mood(null),1600)}

/* ===================== Время по-русски ===================== */
const CARD=['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
const FEM=CARD.slice();FEM[1]='одна';FEM[2]='две';
const TENS={20:'двадцать',30:'тридцать',40:'сорок',50:'пятьдесят'};
const ORD_GEN=['','первого','второго','третьего','четвёртого','пятого','шестого','седьмого','восьмого','девятого','десятого','одиннадцатого','двенадцатого'];
const HOUR_NOM=['','час','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать'];
const GEN=['','одной','двух','трёх','четырёх','пяти','шести','семи','восьми','девяти','десяти','одиннадцати','двенадцати','тринадцати','четырнадцати','пятнадцати','шестнадцати','семнадцати','восемнадцати','девятнадцати','двадцати'];
function plural(n,a,b,c){const t=n%100,u=n%10;if(t>10&&t<20)return c;if(u===1)return a;if(u>=2&&u<=4)return b;return c}
function numF(n){if(n<20)return FEM[n];if(n>=100)return 'сто'+(n>100?' '+numF(n-100):'');const t=Math.floor(n/10)*10,u=n%10;return TENS[t]+(u?' '+FEM[u]:'')}
function minPhrase(m){return numF(m)+' '+plural(m,'минута','минуты','минут')}
function hourPhrase(h){return h===1?'час':CARD[h]+' '+plural(h,'час','часа','часов')}
function genN(n){return n<=20?GEN[n]:'двадцати '+GEN[n-20]}
// Разговорная форма: «половина четвёртого», «без пяти четыре»
function timeWords(T){
  const h=hOf(T),m=mOf(T),nx=h%12+1;
  if(m===0)return hourPhrase(h);
  if(m===30)return 'половина '+ORD_GEN[nx];
  if(m===15)return 'четверть '+ORD_GEN[nx];
  if(m<35)return minPhrase(m)+' '+ORD_GEN[nx];
  const r=60-m;
  let bez;
  if(r===15)bez='без четверти';
  else if(r%5===0)bez='без '+genN(r);
  else bez='без '+genN(r)+' '+(r%10===1&&r!==11?'минуты':'минут');
  return bez+' '+HOUR_NOM[nx];
}
// «Электронная» форма: «три часа тридцать минут»
function fullWords(T){const h=hOf(T),m=mOf(T);return hourPhrase(h)+(m?' '+minPhrase(m):' ровно')}
function promptWords(T){const w=timeWords(T);return mOf(T)===0?'ровно '+w:w}
const ORD_NOM=['','первый','второй','третий','четвёртый','пятый','шестой','седьмой','восьмой','девятый','десятый','одиннадцатый','двенадцатый'];
const INSTR=['','часом','двумя','тремя','четырьмя','пятью','шестью','семью','восемью','девятью','десятью','одиннадцатью','двенадцатью'];
const GENH=['','часа','двух часов','трёх часов','четырёх часов','пяти часов','шести часов','семи часов','восьми часов','девяти часов','десяти часов','одиннадцати часов','двенадцати часов'];
const between=h=>'между '+INSTR[h]+' и '+INSTR[h%12+1];
function passed(h){return h===1?'один час уже прошёл':hourPhrase(h)+' уже прошло'}
function passedVerb(n){return plural(n,'прошла','прошло','прошло')}
// Подробное объяснение: что значит это время
function explain(T){
  const h=hOf(T),m=mOf(T),nx=h%12+1;
  if(m===0)return 'Длинная стрелка наверху — значит, ровно. Короткая на цифре '+h+' — '+hourPhrase(h)+'.';
  const head=cap(passed(h))+', идёт '+ORD_NOM[nx]+' час';
  if(m===30)return head+', и от него прошла половина — тридцать минут.';
  if(m===15)return head+', и от него прошла четверть — пятнадцать минут.';
  if(m<35)return head+', и от него '+passedVerb(m)+' '+minPhrase(m)+'.';
  const r=60-m;
  if(r===15)return head+'. До '+GENH[nx]+' осталась четверть часа — пятнадцать минут.';
  return head+'. До '+GENH[nx]+' '+plural(r,'осталась','осталось','осталось')+' '+minPhrase(r)+'.';
}
/* 24 часа */
const numM=n=>n<20?CARD[n]:'двадцать'+(n>20?' '+CARD[n-20]:'');
const fmt24=(h,m=0)=>h+':'+String(m).padStart(2,'0');
function h24Words(h,m=0){if(m===0)return numM(h)+' '+plural(h,'час','часа','часов');return numM(h)+' '+(m<10?'ноль '+CARD[m]:numF(m))}
const perGen=h=>h<5?'ночи':h<12?'утра':h<17?'дня':'вечера';
const perName=h=>h<5?'🌌 Ночь':h<12?'☀️ Утро':h<17?'🌤️ День':'🌙 Вечер';
function lab12(h24){const h=h24%12||12;return h+' '+plural(h,'час','часа','часов')+' '+perGen(h24)}
function lab12w(h24){const h=h24%12||12;return hourPhrase(h)+' '+perGen(h24)}

/* ===================== Звук и голос ===================== */
let AC=null;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',v=.15,delay=0){
  if(!S.sound)return;const a=actx();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
}

/* Записанный голос: voice/vox.json + спрайты voice/sprites/*.mp3.
   Фраза ищется целиком, иначе складывается из кусочков (минимум кусочков). */
const VX={sprites:null,items:[],lex:new Map(),maxLen:1,bytes:new Map(),bufs:new Map(),used:0,tok:0,srcs:[],done:null,miss:new Set()};
const numMasc=n=>n<20?CARD[n]:n>=100?'сто'+(n>100?' '+numMasc(n-100):''):TENS[Math.floor(n/10)*10]+(n%10?' '+CARD[n%10]:'');
TENS[60]='шестьдесят';TENS[70]='семьдесят';TENS[80]='восемьдесят';TENS[90]='девяносто';
function vxWords(s){
  s=String(s).replace(/\p{Extended_Pictographic}|️|‍/gu,' ').toLowerCase().replace(/ё/g,'е');
  s=s.replace(/(\d{1,2}):(\d\d)/g,(_,h,m)=>{h=+h;m=+m;return ' '+(h===0?'ноль ноль':numMasc(h))+' '+(m===0?'ноль ноль':m<10?'ноль '+CARD[m]:numF(m))+' '});
  s=s.replace(/(\d)\s*[−-]\s*(\d)/g,'$1 минус $2').replace(/\+/g,' плюс ').replace(/=/g,' ');
  s=s.replace(/\d+(?=\s*(секунд|минут))/g,n=>' '+numF(+n)+' ').replace(/\d+/g,n=>' '+numMasc(+n)+' ');
  return s.replace(/[^a-zа-я]+/g,' ').trim().split(' ').filter(Boolean);
}
fetch('voice/vox.json').then(r=>r.json()).then(j=>{
  VX.sprites=j.sprites;
  j.items.forEach(([id,sp,st,du,text])=>{const w=vxWords(text),k=w.join(' ');const it={id,sp,st,du,text};VX.items.push(it);
    if(k&&!VX.lex.has(k))VX.lex.set(k,it);VX.maxLen=Math.max(VX.maxLen,w.length)});
  // самые нужные спрайты (похвала, связки, игры, подсказки, числа) скачиваем заранее
  const core=new Set();['praise.1','q.where','g.again','h.hour','n.1'].forEach(id=>{const it=VX.items.find(x=>x.id===id);if(it)core.add(it.sp)});
  core.forEach(sp=>vxBytes(sp).catch(()=>{}));
}).catch(()=>{});
function vxPlan(text){
  const w=vxWords(text),n=w.length;if(!n)return [];
  const best=new Array(n+1).fill(null);best[n]={c:0};
  for(let j=n-1;j>=0;j--){
    for(let L=Math.min(VX.maxLen,n-j);L>=1;L--){const it=VX.lex.get(w.slice(j,j+L).join(' '));
      if(it&&best[j+L]){const c=best[j+L].c+1;if(!best[j]||c<best[j].c)best[j]={c,it,L}}}
  }
  if(!best[0])return null;
  const out=[];for(let j=0;j<n;j+=best[j].L)out.push(best[j].it);return out;
}
function vxBytes(sp){if(!VX.bytes.has(sp))VX.bytes.set(sp,fetch('voice/sprites/'+VX.sprites[sp]).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}));return VX.bytes.get(sp)}
async function vxBuf(sp){
  if(VX.bufs.has(sp)){const b=VX.bufs.get(sp);VX.bufs.delete(sp);VX.bufs.set(sp,b);return b}
  const a=actx(),ab=await vxBytes(sp);
  const buf=await new Promise((ok,no)=>a.decodeAudioData(ab.slice(0),ok,no));
  VX.bufs.set(sp,buf);VX.used+=buf.length;
  for(const [k,b] of VX.bufs){if(VX.used<=a.sampleRate*600||k===sp)break;VX.bufs.delete(k);VX.used-=b.length}  // держим ~10 минут звука
  return buf;
}
function hush(){VX.tok++;VX.srcs.forEach(s=>{try{s.stop()}catch(e){}});VX.srcs=[];if(VX.done){VX.done();VX.done=null}if(window.speechSynthesis)speechSynthesis.cancel()}
async function say(text){
  if(!S.voice||!text){await new Promise(r=>setTimeout(r,300));return}
  hush();const my=VX.tok;
  const plan=VX.sprites?vxPlan(text):null,a=actx();
  if(!plan||!a){if(VX.sprites&&!VX.miss.has(text)){VX.miss.add(text);console.warn('[голос] нет записи:',text,vxWords(text).join(' '))}return ttsSay(text)}
  let bufs;try{bufs=await Promise.all(plan.map(it=>vxBuf(it.sp)))}catch(e){return my===VX.tok?ttsSay(text):undefined}
  if(my!==VX.tok)return;
  return new Promise(res=>{
    VX.done=res;let t=a.currentTime+.05;
    plan.forEach((it,i)=>{
      const s=a.createBufferSource();s.buffer=bufs[i];s.connect(a.destination);s.start(t,it.st,it.du);VX.srcs.push(s);
      t+=it.du;const nx=plan[i+1];
      if(nx)t+=/[…,]$/.test(it.text)||/^…/.test(nx.text)?.04:/[:—]$/.test(it.text)?.15:.3;
      if(!nx)s.onended=()=>{if(my===VX.tok){VX.srcs=[];if(VX.done===res)VX.done=null;res()}};
    });
  });
}
function ttsSay(text){
  return new Promise(res=>{
    if(!S.voice||!window.speechSynthesis||!text){setTimeout(res,300);return}
    speechSynthesis.cancel();
    const clean=String(text).replace(/\p{Extended_Pictographic}|️|‍/gu,'').replace(/→/g,',');
    const u=new SpeechSynthesisUtterance(clean);u.lang='ru-RU';if(ruVoice)u.voice=ruVoice;u.rate=.92;u.pitch=1.1;
    let done=false;const fin=()=>{if(!done){done=true;clearTimeout(to);res()}};
    const to=setTimeout(fin,1800+clean.length*95);
    u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
  });
}
function burst(){
  const em=['⭐','🌟','✨','🎉','⭐'];
  const cx=innerWidth/2,cy=innerHeight/2.4;
  for(let i=0;i<18;i++){const s=document.createElement('span');s.className='fly';s.textContent=pick(em);
    s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.random()*Math.PI*2,d=120+Math.random()*220;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.setProperty('--r',(rnd(360)-180)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1400)}
}

let NAV=0;const TIMERS=new Set(),IVS=new Set();let CLOCKS=[];
function later(ms){return new Promise(r=>{const id=setTimeout(()=>{TIMERS.delete(id);r()},ms);TIMERS.add(id)})}
function every(fn,ms){const id=setInterval(fn,ms);IVS.add(id);return id}
function go(html,title){
  NAV++;

  TIMERS.forEach(clearTimeout);TIMERS.clear();IVS.forEach(clearInterval);IVS.clear();
  CLOCKS.forEach(c=>c.destroy());CLOCKS=[];

}

const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const DEF={hour:false,minute:false,second:false,labels:false,sector:false,drag:null,numClick:false,hourArc:false,ring24:false};
class Clock{
  constructor(host,opt={}){
    this.T=0;this.acc=0;this.cfg={...DEF};this.onChange=null;this.onRelease=null;this.onNumber=null;this.iv=null;this.raf=null;this.drag=null;
    const box=document.createElement('div');box.className=opt.mini?'minibox':'clockbox';host.appendChild(box);this.box=box;
    const s=this.svg=sv('svg',{viewBox:'-128 -128 256 256',class:'clock'},box);
    sv('circle',{r:125,class:'rim'},s);sv('circle',{r:104,class:'face'},s);
    this.harc=sv('path',{class:'harc',d:''},s);
    this.sec=sv('path',{class:'sector',d:''},s);
    const tg=sv('g',{},s);
    for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?95:88,r2=101;
      sv('line',{x1:r1*Math.sin(a),y1:-r1*Math.cos(a),x2:r2*Math.sin(a),y2:-r2*Math.cos(a),class:i%5?'tk':'tk5'},tg)}
    this.lbl=sv('g',{},s);
    for(let i=0;i<12;i++){const a=i*30*Math.PI/180;const t=sv('text',{x:114.5*Math.sin(a),y:-114.5*Math.cos(a),class:'rl'},this.lbl);t.textContent=String(i*5)}
    this.r24=sv('g',{},s);
    for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;const t=sv('text',{x:53*Math.sin(a),y:-53*Math.cos(a),class:'r24'},this.r24);t.textContent=n+12}
    this.nums={};const ng=sv('g',{},s);
    for(let n=1;n<=12;n++){const a=n*30*Math.PI/180,x=75*Math.sin(a),y=-75*Math.cos(a);
      const g=sv('g',{class:'num'},ng);sv('circle',{cx:x,cy:y,r:16,class:'nb'},g);const t=sv('text',{x,y,class:'nt'},g);t.textContent=n;this.nums[n]=g}
    this.hh=sv('g',{class:'hand hh'},s);sv('line',{x1:0,y1:12,x2:0,y2:-52},this.hh);
    this.mh=sv('g',{class:'hand mh'},s);sv('line',{x1:0,y1:14,x2:0,y2:-86},this.mh);
    this.sh=sv('g',{class:'hand sh'},s);sv('line',{x1:0,y1:24,x2:0,y2:-94},this.sh);sv('circle',{cx:0,cy:17,r:5},this.sh);
    sv('circle',{r:8,class:'cap'},s);sv('circle',{r:3,class:'cap2'},s);
    this.bind();this.apply();this.render();CLOCKS.push(this);
  }
  destroy(){clearInterval(this.iv);cancelAnimationFrame(this.raf)}
  config(c){this.cfg={...DEF,...c};this.apply();this.render();return this}
  apply(){const c=this.cfg;
    this.hh.style.display=c.hour?'':'none';this.mh.style.display=c.minute?'':'none';this.sh.style.display=c.second?'':'none';
    this.lbl.style.display=c.labels?'':'none';this.r24.style.display=c.ring24?'':'none';this.svg.classList.toggle('drag',!!c.drag);this.svg.classList.toggle('numclick',!!c.numClick);
    this.sec.classList.toggle('s',c.sector==='sec')}
  set(T){cancelAnimationFrame(this.raf);this.T=norm(T);this.render();return this}
  render(){
    const T=this.T;
    this.hh.setAttribute('transform',`rotate(${T/120})`);
    this.mh.setAttribute('transform',`rotate(${(T%3600)/10})`);
    this.sh.setAttribute('transform',`rotate(${(T%60)*6})`);
    if(this.cfg.hourArc){const a1=Math.floor(T/3600)%12*30*Math.PI/180,a2=a1+Math.PI/6,R=104,r=38;
      const P=(rr,aa)=>`${(rr*Math.sin(aa)).toFixed(2)} ${(-rr*Math.cos(aa)).toFixed(2)}`;
      this.harc.setAttribute('d',`M${P(r,a1)} L${P(R,a1)} A${R} ${R} 0 0 1 ${P(R,a2)} L${P(r,a2)} A${r} ${r} 0 0 0 ${P(r,a1)} Z`)}
    else this.harc.setAttribute('d','');
    if(this.onRender)this.onRender(T);
    let a=null;
    if(this.cfg.sector==='min')a=(T%3600)/10;else if(this.cfg.sector==='sec')a=this.secFull?360:(T%60)*6;
    if(a===null||a<.5){this.sec.setAttribute('d','');return}
    if(a>=359.5){this.sec.setAttribute('d','M0 -104 A104 104 0 1 1 -0.01 -104 Z');return}
    const r=104,x=r*Math.sin(a*Math.PI/180),y=-r*Math.cos(a*Math.PI/180);
    this.sec.setAttribute('d',`M0 0 L0 -${r} A${r} ${r} 0 ${a>180?1:0} 1 ${x} ${y} Z`);
  }
  animTo(target,ms=1200,raw=false){
    cancelAnimationFrame(this.raf);const from=this.T;let d=raw?target-from:target-from;
    if(!raw){d=((d%43200)+43200)%43200;if(d>21600)d-=43200}
    return new Promise(res=>{const t0=performance.now();
      const step=now=>{const k=Math.min(1,(now-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
        this.T=norm(from+d*e);this.render();if(k<1)this.raf=requestAnimationFrame(step);else{this.T=norm(from+d);this.render();res()}};
      this.raf=requestAnimationFrame(step)})
  }
  run(on,tick=false,onTick=null){clearInterval(this.iv);this.iv=null;
    if(on)this.iv=setInterval(()=>{this.T=norm(this.T+1);this.acc++;this.render();if(tick)sfx.tick(this.T%2);onTick&&onTick(this)},1000)}
  glow(n,on=true){this.nums[n].classList.toggle('glow',on)}
  mark(n,cls,on=true){this.nums[n].classList.toggle(cls,on)}
  clearMarks(){for(let n=1;n<=12;n++)this.nums[n].classList.remove('glow','done','bad')}
  local(e){const p=this.svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(this.svg.getScreenCTM().inverse());
    return{a:(Math.atan2(q.x,-q.y)*180/Math.PI+360)%360,r:Math.hypot(q.x,q.y)}}
  pick(a,r){const c=this.cfg,d=c.drag,T=this.T,list=[];
    if(d.hour&&c.hour)list.push({k:'hour',ang:T/120,len:42});
    if(d.minute&&c.minute)list.push({k:'minute',ang:(T%3600)/10,len:82});
    if(d.second&&c.second)list.push({k:'second',ang:(T%60)*6,len:96});
    if(!list.length)return null;if(list.length===1)return list[0].k;
    const diff=x=>{const v=Math.abs(x-a)%360;return Math.min(v,360-v)};
    list.forEach(o=>o.d=diff(o.ang));
    const near=list.filter(o=>o.d<24);
    if(near.length===1)return near[0].k;
    if(near.length>1){near.sort((p,q)=>Math.abs(p.len-r)-Math.abs(q.len-r));return near[0].k}
    list.sort((p,q)=>p.d-q.d);return list[0].k}
  moveTo(k,a){const d=this.cfg.drag;let delta=0;const wrap=(v,M)=>{v=((v%M)+M)%M;return v>M/2?v-M:v};
    if(k==='hour'){const s=d.hour;delta=wrap(norm(Math.round(a*120/s)*s)-this.T,43200)}
    else if(k==='minute'){const s=d.minute;delta=wrap((Math.round(a*10/s)*s)%3600-this.T%3600,3600)}
    else{const s=d.second||1;delta=wrap((Math.round(a/6/s)*s)%60-this.T%60,60)}
    if(delta){this.T=norm(this.T+delta);this.acc+=delta;this.render();sfx.tick();this.onChange&&this.onChange(this,delta)}}
  bind(){const s=this.svg;
    s.addEventListener('pointerdown',e=>{actx();const{a,r}=this.local(e),c=this.cfg;
      if(c.numClick){if(this.onNumber&&r>50&&r<110){e.preventDefault();this.onNumber(Math.round(a/30)%12||12,this)}return}
      if(!c.drag)return;e.preventDefault();const k=this.pick(a,r);if(!k)return;
      this.drag=k;cancelAnimationFrame(this.raf);try{s.setPointerCapture(e.pointerId)}catch(_){}
      this.moveTo(k,a)});
    s.addEventListener('pointermove',e=>{if(this.drag){e.preventDefault();this.moveTo(this.drag,this.local(e).a)}});
    const up=()=>{if(this.drag){this.drag=null;this.onRelease&&this.onRelease(this)}};
    s.addEventListener('pointerup',up);s.addEventListener('pointercancel',up);
  }
}

         {type:'show',em:'👆',title:'Поставь стрелку',p:{mins:MINS.whole,hourOnly:true}}]},

 {id:'L3',em:'🐰',title:'Длинная стрелка',base:B3,steps:[
  {t:'Знакомься: длинная синяя стрелка. Она быстрая, как зайчик. Её зовут минутная, потому что она показывает минуты.',T:H(3)},
  {t:'Посмотри на маленькие чёрточки по краю. Их шестьдесят. Каждая чёрточка — одна минута. А целый круг — шестьдесят минут, то есть один час.',T:H(3),cfg:{labels:false}},
  {t:'Когда длинная стрелка смотрит наверх, на двенадцать, время ровное. Короткая на тройке — значит, ровно три часа.',T:H(3),enter:c=>glowList(c,[12,3])},
  {t:'Смотри, что будет, если длинная стрелка пробежит целый круг.',T:H(3),cfg:{sector:'min'},
   anim:async c=>{await c.animTo(H(4),5000);c.glow(4)}},
  {t:'Короткая стрелка переползла на одну цифру! Было три часа — стало четыре. Пока зайчик бежит круг, черепаха делает один шаг.',T:H(4),enter:c=>glowList(c,[3,4])},
  {t:'Ещё примеры. Длинная наверху, короткая на семёрке — ровно семь часов. Короткая на десятке — ровно десять. Короткая на двенадцати — ровно двенадцать: обе стрелки смотрят вверх.',T:H(4),
   anim:async(c,st)=>{for(const h of [7,10,12]){if(st())return;glowList(c,[h,12]);await c.animTo(H(h),1100);if(st())return;await say(cap(promptWords(H(h))))}}},
  {t:'Теперь ты! Прокрути длинную стрелку целый круг и следи за короткой.',T:H(4),cfg:{sector:'min'},drag:{minute:60},
   task:{check:(c,x)=>Math.abs(c.acc-x.A0)>=3540}},
  {t:'Запомни: длинная наверху — значит, ровно. А короткая показывает, сколько часов. Поиграем!',T:H(5)}],
  games:[{type:'find',em:'🔎',title:'Где ровно?',p:{mins:MINS.whole}},
         {type:'show',em:'👆',title:'Поставь ровно',p:{mins:MINS.whole}}]},

 {id:'LH',em:'🔑',title:'Какой час идёт?',base:{...B3,hourArc:true},steps:[
  {t:'Сейчас я открою тебе главный секрет часов. Он поможет понять, почему говорят «пятнадцать минут третьего» или «половина четвёртого».',T:0},
  {t:'Короткая стрелка ушла от двенадцати и идёт к единице. Пока она идёт от двенадцати до одного, идёт первый час. Я подсветил этот кусочек.',T:0,enter:c=>{glowList(c,[12,1]);c.animTo(H(0,40),2500)}},
  {t:'Стрелка дошла до единицы — первый час закончился. Теперь, от одного до двух, идёт второй час.',T:H(0,40),enter:c=>{glowList(c,[1,2]);c.animTo(H(1,40),2500)}},
  {t:'А от двух до трёх идёт третий час.',T:H(1,40),enter:c=>{glowList(c,[2,3]);c.animTo(H(2,40),2500)}},
  {t:'Запомни: если короткая стрелка между двумя и тремя, значит, два часа уже прошло, а идёт третий час.',T:H(2,40),enter:c=>glowList(c,[2,3])},
  {t:'Поэтому и говорят: пятнадцать минут третьего. Это значит: два часа уже прошло, начался третий час, и от него прошло пятнадцать минут.',T:H(2,15),cfg:{sector:'min'},enter:c=>glowList(c,[2,3])},
  {t:'Ещё пример: двадцать минут пятого. Четыре часа прошло, идёт пятый час, и от него прошло двадцать минут.',T:H(4,20),cfg:{sector:'min'},enter:c=>glowList(c,[4,5])},
  {t:'И ещё: десять минут восьмого. Семь часов прошло, идёт восьмой час, и прошло десять минут.',T:H(7,10),cfg:{sector:'min'},enter:c=>glowList(c,[7,8])},
  {t:'Правило простое: номер часа на один больше, чем цифра, которую стрелка уже прошла. Прошла тройку — идёт четвёртый час. Прошла девятку — идёт десятый.',T:H(3,25),
   anim:async(c,st)=>{await later(300);if(st())return;glowList(c,[9,10]);await c.animTo(H(9,25),1500)}},
  {t:'Самый хитрый случай — между двенадцатью и единицей. Двенадцать часов прошло, а идёт первый час, потому что начался новый круг.',T:H(0,20),enter:c=>glowList(c,[12,1])},
  {t:'Покажи сам, где идёт шестой час. Потяни короткую стрелку, чтобы она стояла между пятью и шестью.',T:0,drag:{hour:300},
   task:{check:c=>Math.floor(c.T/3600)%12===5&&c.T%3600!==0}},
  {t:'Правильно! Пять часов прошло, идёт шестой час. Поиграем!'}],
  games:[{type:'whichHour',em:'🔑',title:'Какой час идёт?'},{type:'hourShow',em:'👆',title:'Покажи нужный час'}]},

 {id:'L4',em:'🍕',title:'Половина',base:{...B3,sector:'min'},steps:[
  {t:'Сейчас ровно три часа. Длинная стрелка наверху, короткая на тройке.',T:H(3),enter:c=>glowList(c,[12,3])},
  {t:'Пусть длинная стрелка побежит… Стоп! Она пробежала половину круга и смотрит вниз, на шесть.',T:H(3),enter:c=>{c.clearMarks();c.animTo(H(3,30),3500)}},
  {t:'Закрашена ровно половина круга — как половинка пиццы. Значит, прошло полчаса, то есть тридцать минут.',T:H(3,30),enter:c=>glowList(c,[6])},
  {t:'А короткая стрелка ушла от тройки и стоит посередине, между тремя и четырьмя.',T:H(3,30),cfg:{hourArc:true},enter:c=>glowList(c,[3,4])},
  {t:'Вспомни секрет: три часа уже прошло, и идёт четвёртый час. А от четвёртого часа прошла ровно половина.',T:H(3,30),cfg:{hourArc:true}},
  {t:'Поэтому так и говорят: половина четвёртого. Половина того часа, который идёт сейчас.',T:H(3,30),cfg:{hourArc:true}},
  {t:'Будь внимателен: половина четвёртого — это не четыре часа! Это три часа и ещё полчаса. Цифрами пишут так: 3:30.',big:'3:30',T:H(3,30),cfg:{hourArc:true}},
  {t:'Ещё пример: короткая между семью и восемью, длинная внизу. Семь часов прошло, идёт восьмой час, прошла его половина. Это половина восьмого.',T:H(7,30),cfg:{hourArc:true},enter:c=>glowList(c,[7,8])},
  {t:'А это половина первого: двенадцать часов прошло, начался первый час, и прошла его половина.',T:H(0,30),cfg:{hourArc:true},enter:c=>glowList(c,[12,1])},
  {t:'Поставь сам половину пятого. Подумай: какой час идёт? Пятый — значит, короткая стрелка между четырьмя и пятью. А длинная — вниз, на шесть.',T:0,drag:{hour:300,minute:300},cfg:{hourArc:true},
   task:{check:c=>c.T===H(4,30)}},
  {t:'Ура! Четыре часа прошло, и прошла половина пятого часа. Поиграем!',T:H(4,30)}],
  games:[{type:'find',em:'🔎',title:'Найди половину',p:{mins:MINS.half}},
         {type:'show',em:'👆',title:'Поставь половину',p:{mins:MINS.half}}]},

 {id:'L5',em:'🍰',title:'Четверти',base:{...B3,sector:'min'},steps:[
  {t:'Разрежем круг-пиццу на четыре одинаковых кусочка. Один кусочек называется четверть. Это пятнадцать минут.',T:H(2),enter:c=>c.animTo(H(2,15),2500)},
  {t:'Длинная стрелка смотрит на тройку — прошла одна четверть часа. А короткая чуть-чуть отошла от двойки.',T:H(2,15),enter:c=>glowList(c,[3,2])},
  {t:'Два часа уже прошло, идёт третий час, и от него прошла четверть. Поэтому говорят: четверть третьего. Можно сказать и так: пятнадцать минут третьего.',T:H(2,15),cfg:{hourArc:true},enter:c=>glowList(c,[2,3])},
  {t:'Длинная на шестёрке — прошло два кусочка. Это уже знакомая половина третьего.',T:H(2,15),enter:c=>{glowList(c,[6]);c.animTo(H(2,30),1500)}},
  {t:'Длинная на девятке — прошло три кусочка. До трёх часов остался всего один кусочек, одна четверть.',T:H(2,30),enter:c=>{glowList(c,[9]);c.animTo(H(2,45),1500)}},
  {t:'Поэтому говорят: без четверти три. «Без» значит «не хватает». До трёх часов не хватает четверти часа — пятнадцати минут.',T:H(2,45),cfg:{hourArc:true},enter:c=>glowList(c,[2,3])},
  {t:'Посмотри: короткая стрелка почти дошла до тройки. Ещё немного — и будет ровно три.',T:H(2,45),anim:async c=>{await c.animTo(H(3),2500);glowList(c,[3,12])}},
  {t:'Ещё пример: четверть восьмого. Семь часов прошло, идёт восьмой час, прошла его четверть. А без четверти восемь — до восьми осталась четверть часа.',T:H(7,15),
   anim:async(c,st)=>{await later(1500);if(!st())c.animTo(H(7,45),1500)}},
  {t:'Запомни: на тройке — четверть, на шестёрке — половина, на девятке — без четверти.',T:H(4),
   anim:async(c,st)=>{for(const m of [15,30,45]){if(st())return;await c.animTo(H(4,m),1200);if(st())return;await say(timeWords(H(4,m)))}}},
  {t:'Поставь без четверти шесть. Подсказка: до шести не хватает четверти, значит, короткая стрелка уже почти дошла до шестёрки.',T:0,drag:{hour:300,minute:300},task:{check:c=>c.T===H(5,45)}},
  {t:'Отлично! Поиграем!',T:H(5,45)}],
  games:[{type:'find',em:'🔎',title:'Найди четверть',p:{mins:MINS.quarter}},
         {type:'show',em:'👆',title:'Поставь четверть',p:{mins:MINS.quarter}}]},

 {id:'L6',em:'🖐️',title:'Минуты по пять',base:{...B3,labels:true},steps:[
  {t:'Для длинной стрелки каждая цифра — это прыжок на пять минут. Давай посчитаем пятёрками!',T:H(3),
   anim:async(c,st)=>{for(let k=1;k<=12;k++){if(st())return;await c.animTo(H(3,5*k),350);if(st())return;await say(String(5*k))}}},
  {t:'Подсказки на ободе показывают минуты. Длинная на двойке — это десять минут.',T:H(3,10),enter:c=>glowList(c,[2])},
  {t:'Сейчас десять минут четвёртого. Почему четвёртого? Три часа уже прошло, идёт четвёртый час, и от него прошло десять минут.',T:H(3,10),cfg:{hourArc:true},enter:c=>glowList(c,[3,4])},
  {t:'Ещё пример: пять минут девятого. Восемь часов прошло, идёт девятый час, и прошло пять минут.',T:H(8,5),cfg:{hourArc:true},enter:c=>glowList(c,[1])},
  {t:'Двадцать пять минут четвёртого. Короткая всё ещё между тройкой и четвёркой: четвёртый час продолжается.',T:H(3,25),cfg:{hourArc:true},enter:c=>glowList(c,[3,4])},
  {t:'Круг делится на две половинки. Справа, от двенадцати до шести, считаем, сколько минут прошло. Слева, от шести до двенадцати, — сколько осталось до следующего часа.',T:H(3,30),cfg:{sector:'min'}},
  {t:'Длинная на десятке. До двенадцати ей осталось две цифры — это десять минут. До четырёх часов не хватает десяти минут. Говорят: без десяти четыре.',T:H(3,50),enter:c=>glowList(c,[10,11,12])},
  {t:'Длинная на восьмёрке — до двенадцати четыре прыжка, двадцать минут. Это без двадцати четыре.',T:H(3,40),enter:c=>glowList(c,[8])},
  {t:'Ещё пример: без пяти девять. До девяти часов осталось всего пять минут — длинная на одиннадцати, короткая почти на девятке.',T:H(8,55),enter:c=>glowList(c,[11,9])},
  {t:'Можно сказать и по-другому: восемь пятьдесят пять, как на телефоне. Оба способа правильные.',big:'8:55',T:H(8,55)},
  {t:'Поставь двадцать минут пятого. Подумай: длинная — на четвёртый прыжок, короткая — чуть дальше четвёрки.',T:0,drag:{hour:300,minute:300},task:{check:c=>c.T===H(4,20)}},
  {t:'Молодец! Поиграем!',T:H(4,20)}],
  games:[{type:'find',em:'🔎',title:'Найди время',p:{mins:MINS.five}},
         {type:'show',em:'👆',title:'Поставь время',p:{mins:MINS.five,labels:true}}]},

 {id:'L7',em:'🐭',title:'Секундная стрелка',base:{...B3,second:true},steps:[
  {t:'Есть ещё одна стрелка — самая тонкая, зелёная. Это секундная. Она быстрая, как мышка.',T:H(3),enter:c=>c.run(true)},
  {t:'Слышишь: тик-так? Каждый тик — это одна секунда. Секунда — это очень мало: столько длится один хлопок в ладоши.',enter:c=>c.run(true,true)},
  {t:'Пока мышка пробегает целый круг, проходит одна минута — шестьдесят секунд. И длинная стрелка делает один маленький шажок — на одну чёрточку.',T:H(3),cfg:{sector:'sec'},
   enter:c=>c.animTo(H(3,1),9000,true)},
  {t:'Получается цепочка: мышка пробегает круг — зайчик делает шажок. Зайчик пробегает круг — черепаха переходит на следующую цифру.',T:H(3,1)},
  {t:'Попробуй сам: покрути зелёную стрелку целый круг и посмотри на длинную.',T:H(3),drag:{second:1},task:{check:(c,x)=>Math.abs(c.acc-x.A0)>=58}},
  {t:'Секунды нужны, чтобы считать короткое время: сколько ты бежал или сколько варится яйцо. А когда называют время, секунды не говорят — только часы и минуты. Поиграем!',T:H(3,1)}],
  games:[{type:'jump',em:'🤸',title:'Прыгай минуту'},{type:'guess',em:'🙈',title:'Угадай минуту'}]},

 {id:'L8',em:'⌚',title:'Любые минуты',base:{...B3,labels:true},steps:[
  {t:'Между цифрами есть маленькие чёрточки. Каждая чёрточка — одна минута.',T:H(3),
   anim:async(c,st)=>{for(let k=1;k<=5;k++){if(st())return;await c.animTo(H(3,k),300);if(st())return;await say(String(k))}}},
  {t:'Сейчас длинная стрелка на третьей чёрточке после двойки. Двойка — это десять, и ещё три чёрточки — тринадцать минут. Тринадцать минут четвёртого.',T:H(3,13),enter:c=>glowList(c,[2])},
  {t:'Ещё пример: длинная на одной чёрточке после пятёрки. Пятёрка — двадцать пять, и ещё одна — двадцать шесть минут.',T:H(3,26),enter:c=>glowList(c,[5])},
  {t:'Когда минут больше половины, можно сказать двумя способами. Тридцать восемь минут пятого — или без двадцати двух пять. Оба правильные!',T:H(4,38)},
  {t:'На телефоне время пишут цифрами: сначала часы, потом две точки, потом минуты.',big:'3:13',T:H(3,13)},
  {t:'Половина четвёртого — это три тридцать. А без четверти четыре — три сорок пять.',big:'3:30 → 3:45',T:H(3,13),
   enter:async(c,st)=>{await c.animTo(H(3,30),1200);await later(2500);if(!st())c.animTo(H(3,45),1200)}},
  {t:'Поставь 4:18.',big:'4:18',T:0,drag:{hour:60,minute:60},task:{check:c=>c.T===H(4,18)}},
  {t:'Ты настоящий знаток часов! Поиграем!',T:H(4,18)}],
  games:[{type:'find',em:'🔎',title:'Найди время',p:{mins:MINS.any}},
         {type:'show',em:'👆',title:'Поставь время',p:{mins:MINS.any,step:60,digital:true}},
         {type:'readText',em:'🔢',title:'Как записать?',p:{mins:MINS.any}}]},

 {id:'LD',em:'📱',title:'Цифры в стрелки',base:{...B3,labels:true},steps:[
  {t:'Время часто пишут цифрами: на телефоне, на плите, в расписании автобусов. Давай научимся превращать цифры в стрелки.',big:'4:25',T:0},
  {t:'Посмотри на запись 4:25. Число до двух точек — это часы. Число после двух точек — минуты.',big:'4 : 25',T:0},
  {t:'Начинаем с минут, с длинной стрелки. Двадцать пять минут — считаем пятёрками: пять, десять, пятнадцать, двадцать, двадцать пять. Пятый прыжок — цифра пять.',big:'25',T:H(4),
   anim:async(c,st)=>{for(let k=1;k<=5;k++){if(st())return;await c.animTo(H(4,5*k),400);if(st())return;await say(String(5*k))}}},
  {t:'Хитрость: раздели минуты на пять — и узнаешь цифру для длинной стрелки. Двадцать пять разделить на пять — пять. Сорок пять — девять. Тридцать — шесть.',big:'25 : 5 = 5',T:H(4,25),enter:c=>glowList(c,[5])},
  {t:'Теперь короткая стрелка. Часов четыре, но уже прошло двадцать пять минут. Поэтому короткая стоит не прямо на четвёрке, а немного дальше, по пути к пятёрке.',big:'4:25',T:H(4,25),cfg:{hourArc:true},enter:c=>glowList(c,[4,5])},
  {t:'Короткая стоит точно на цифре, только когда минут ноль, например 4:00. Чем больше минут, тем ближе она к следующей цифре.',big:'4:00 → 4:55',T:H(4),
   anim:async(c,st)=>{if(!st())await c.animTo(H(4,55),5000)}},
  {t:'Пример: 7:30. Длинная — на шестёрку, потому что тридцать разделить на пять — шесть. Короткая — посередине между семью и восемью.',big:'7:30',T:H(7,30),enter:c=>glowList(c,[6,7,8])},
  {t:'Пример: 9:15. Длинная — на тройку. Короткая — чуть-чуть после девятки.',big:'9:15',T:H(9,15),enter:c=>glowList(c,[3,9])},
  {t:'Пример: 2:50. Длинная — на десятку. Короткая — почти у тройки, но ещё не дошла: три часа ещё не наступило!',big:'2:50',T:H(2,50),enter:c=>glowList(c,[10,2,3])},
  {t:'Пример: 12:05. Длинная — на единицу. Короткая — чуть-чуть после двенадцати.',big:'12:05',T:H(0,5),enter:c=>glowList(c,[1,12])},
  {t:'А если минуты не делятся на пять, например 6:08: длинная стоит на третьей чёрточке после единицы. Пять и ещё три — восемь.',big:'6:08',T:H(6,8),enter:c=>glowList(c,[1])},
  {t:'Твоя очередь! Поставь стрелки: 3:40.',big:'3:40',T:0,drag:{hour:300,minute:300},task:{check:c=>c.T===H(3,40)}},
  {t:'Ура! Теперь ты умеешь читать цифры и показывать их стрелками. Поиграем!',T:H(3,40)}],

const gkey=(li,gi)=>LESSONS[li].id+'-'+gi;
const gStars=(li,gi)=>S.g[gkey(li,gi)]||0;
const lessonDone=li=>LESSONS[li].games.every((_,gi)=>gStars(li,gi)>0);
const unlocked=li=>S.all||li===0||lessonDone(li-1);
function lessonStars(li){const L=LESSONS[li];const done=L.games.filter((_,gi)=>gStars(li,gi)>0);if(!done.length)return 0;
  return Math.round(L.games.reduce((s,_,gi)=>s+gStars(li,gi),0)/L.games.length)}
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);

/* ===================== Урок: объяснение ===================== */
function runIntro(li){
  const L=LESSONS[li];
  const tok=go(`<div class="stage"><div class="clockcol" id="cc"></div>
    <div><div class="bubble">${mascot()}<div class="txt"><div class="q" id="q"></div><div class="big" id="big"></div></div><button class="say" id="rep">🔊</button></div>
    <div class="fb" id="fb"></div>
    <div class="row actions"><button class="btn sec" id="back">◀</button><button class="btn go" id="next">Дальше ▶</button></div>
    <div class="steps" id="steps"></div></div></div>`,`Урок ${li+1}. ${L.title}`);
  const c=new Clock($('#cc'));let k=0,stepTok=0;const bar=L.dayBar?dayBar($('#cc')):null;
  $('#steps').innerHTML=L.steps.map(()=>'<i></i>').join('');
  async function run(){
    const st=L.steps[k],my=++stepTok,stale=()=>!alive(tok)||my!==stepTok;
    c.run(false);c.onChange=null;c.onRelease=null;c.onRender=null;c.secFull=false;c.clearMarks();
    c.config({...L.base,...(st.cfg||{}),drag:st.drag||null});
    if(st.T!=null)c.set(st.T);
    if(bar){if(st.bar!=null)bar.set(st.bar);if(st.pm!=null){bar.set(st.pm);c.onRender=T=>bar.set(st.pm+T/3600)}}
    $('#q').textContent=st.t;$('#big').textContent=st.big||'';$('#fb').textContent='';$('#fb').className='fb';
    [...$('#steps').children].forEach((e,i)=>e.classList.toggle('on',i<=k));
    $('#back').disabled=k===0;
    const last=k===L.steps.length-1;$('#next').textContent=last?'Играть ▶':'Дальше ▶';
    const nx=$('#next');
    if(st.task){nx.disabled=true;const x={T0:c.T,A0:c.acc};let done=false;
      const chk=()=>{if(!done&&!stale()&&st.task.check(c,x)){done=true;nx.disabled=false;sfx.good();burst();
        $('#fb').textContent='Получилось! Нажми «Дальше».';$('#fb').className='fb ok';later(400).then(()=>{if(!stale())say(pick(PRAISE)+' Получилось!')})}};
      c.onChange=chk;
      c.onRelease=cc=>{chk();if(st.onRelease)st.onRelease(cc)};
    }else nx.disabled=false;
    if(st.enter)st.enter(c,stale,bar);
    await say(st.t);if(stale())return;
    if(st.anim)await st.anim(c,stale,bar);
  }
  $('#next').onclick=()=>{actx();if(k<L.steps.length-1){k++;run()}else{S.seen[L.id]=1;save();startGame(li,0)}};
  $('#back').onclick=()=>{if(k>0){k--;run()}};
  $('#rep').onclick=()=>say(L.steps[k].t);
  run();
}

/* ===================== Игры ===================== */
const ROUNDS=5;
function starsFor(ok,n){const r=ok/n;return r>=.8?3:r>=.4?2:1}
function gen(p,avoid=[]){let T,i=0;do{T=H(rnd(12),pick(p.mins));i++}while(avoid.includes(T)&&i<50);return T}
function distract(T,p){
  const h=Math.floor(T/3600),m=mOf(T),classic=[H(h+1,m),H(h-1,m)];
  if(p.hourOnly)classic.push(H(h+6,0));
  else if(m%5===0)classic.push(H(m/5,(h%12)*5));
  const out=[];for(const x of shuffle(classic))if(x!==T&&!out.includes(x))out.push(x);
  let i=0;while(out.length<4&&i<60){const x=gen(p);if(x!==T&&!out.includes(x))out.push(x);i++}
  return out.slice(0,2);
}
function minuteSpot(m){const ORD=['','первую','вторую','третью','четвёртую'];
  if(m===0)return 'наверх, на двенадцать';if(m%5===0)return 'на цифру '+m/5;
  return 'на '+ORD[m%5]+' чёрточку после цифры '+(Math.floor(m/5)||12)}
function showHint(T,target,hourOnly,digital){
  const th=hOf(target),tm=mOf(target),cm=mOf(T),nx=th%12+1;
  if(hourOnly)return 'Короткая стрелка должна смотреть на цифру '+th+'.';
  if(cm!==tm){
    if(digital&&tm%5===0&&tm>0)return 'Минут '+tm+'. Раздели на пять: получится '+tm/5+'. Длинная стрелка должна смотреть на цифру '+tm/5+'.';
    return 'Длинная стрелка должна смотреть '+minuteSpot(tm)+'.';}
  return tm===0?'Длинная — верно! Теперь короткая: она должна смотреть на цифру '+th+'.'
               :'Длинная — верно! А короткая должна стоять '+between(th)+': '+passed(th)+', идёт '+ORD_NOM[nx]+' час.';
}

function gameShell(title,opts={}){
  const tok=go(`<div class="dots" id="dots"></div><div class="stage"><div class="clockcol" id="cc"></div>
   <div><div class="bubble">${mascot()}<div class="txt"><div class="q" id="q"></div><div class="big" id="big"></div></div><button class="say" id="rep">🔊</button></div>
   <div id="area"></div><div class="fb" id="fb"></div><div class="row actions" id="act"></div></div></div>`,title);
  const ui={tok,q:$('#q'),big:$('#big'),area:$('#area'),fb:$('#fb'),act:$('#act'),cc:$('#cc'),
    dots(n,cur,res){$('#dots').innerHTML=Array.from({length:n},(_,i)=>`<i class="dot ${res[i]||(i===cur?'cur':'')}"></i>`).join('')},
    ask(text,big='',spoken=text){ui.q.textContent=text;ui.big.textContent=big;ui.fb.textContent='';ui.fb.className='fb';ui.lastSay=spoken;return say(spoken)},
    fbk(text,ok,sub){ui.fb.textContent=text;ui.fb.className='fb '+(ok?'ok':'no');if(sub){const e=document.createElement('span');e.className='sub';e.textContent=sub;ui.fb.appendChild(e)}},
    lastSay:''};
  $('#rep').onclick=()=>say(ui.lastSay);
  return ui;
}

function startGame(li,gi,xkey){
  const G=typeof gi==='object'?gi:LESSONS[li].games[gi];
  const key=xkey||gkey(li,gi);
  const finish=stars=>{S.g[key]=Math.max(S.g[key]||0,stars);save();showResult(li,gi,stars,G)};
  const title=G.em+' '+G.title;
  ({order:gOrder,findNum:gFindNum,whichHour:gWhichHour,hourShow:gHourShow,conv:gConv,read24:gRead24,show24:gShow24,find:gFind,show:gShow,readText:gReadText,day:gDay,jump:gJump,guess:gGuess})[G.type](G.p||{},title,finish);
}

/* --- Цифры по порядку --- */
function gOrder(p,title,finish){
  const ui=gameShell(title);const c=new Clock(ui.cc).config({numClick:true});
  let next=1,err=0,miss=0;$('#dots').style.display='none';
  ui.ask('Нажимай на цифры по порядку: один, два, три…');
  c.onNumber=async n=>{
    if(next>12)return;
    if(n===next){c.mark(n,'done');c.glow(n,false);sfx.pop(n);miss=0;say(CARD[n]);next++;
      if(next>12){sfx.win();burst();ui.fbk('Все цифры по порядку!',true);await later(600);await say('Ура! Все цифры по порядку!');if(alive(ui.tok))finish(err<=1?3:err<=4?2:1)}}
    else if(c.nums[n].classList.contains('done'))return;
    else{err++;miss++;sfx.bad();c.mark(n,'bad');later(500).then(()=>c.mark(n,'bad',false));
      const t='Это цифра '+n+'. А какая идёт после '+(next-1||'начала')+'?';
      ui.fbk(next===1?'Начни с цифры один.':t,false);say(next===1?'Начни с цифры один.':'Это цифра '+n+'. Ищи цифру '+next+'.');if(miss>=2)c.glow(next)}};
}

/* --- Найди цифру --- */
function gFindNum(p,title,finish){
  const ui=gameShell(title);const c=new Clock(ui.cc).config({numClick:true});
  const list=shuffle([...Array(12)].map((_,i)=>i+1)).slice(0,ROUNDS);let r=-1,ok=0,tries=0,lock=false;const res=[];
  const next=()=>{r++;if(r>=ROUNDS)return finish(starsFor(ok,ROUNDS));tries=0;lock=false;c.clearMarks();ui.dots(ROUNDS,r,res);
    ui.ask('Найди цифру '+CARD[list[r]]+'.',String(list[r]))};
  c.onNumber=async n=>{if(lock)return;const t=list[r];
    if(n===t){lock=true;if(!tries)ok++;res[r]=tries?'meh':'ok';c.mark(n,'done');sfx.good();burst();ui.fbk(pick(PRAISE),true);await say(pick(PRAISE));await later(500);if(alive(ui.tok))next()}
    else{tries++;sfx.bad();c.mark(n,'bad');later(600).then(()=>c.mark(n,'bad',false));ui.fbk('Это '+n+'. Ищи '+t+'.',false);say('Это цифра '+n+'. Ищи цифру '+t+'.');if(tries>=2)c.glow(t)}};
  next();
}

/* --- Найди часы (3 маленьких) --- */
function gFind(p,title,finish){
  const ui=gameShell(title);ui.cc.innerHTML='<div class="minis" id="minis"></div>';$('.stage').classList.add('wide');
  let r=-1,ok=0,prev=[];const res=[];
  const next=()=>{r++;if(r>=ROUNDS)return finish(starsFor(ok,ROUNDS));ui.dots(ROUNDS,r,res);
    CLOCKS=[];const box=$('#minis');box.innerHTML='';
    const target=gen(p,prev);prev.push(target);const opts=shuffle([target,...distract(target,p)]);
    let tries=0,lock=false;const words=promptWords(target);
    opts.forEach(T=>{const d=document.createElement('div');d.className='mini';box.appendChild(d);
      new Clock(d,{mini:true}).config({hour:true,minute:!p.hourOnly}).set(T);
      d.onclick=async()=>{if(lock)return;actx();
        if(T===target){lock=true;if(!tries)ok++;res[r]=tries?'meh':'ok';d.classList.add('ok');sfx.good();burst();
          const ph=pick(PRAISE),ex=p.hourOnly?'':explain(target);ui.fbk(ph+' '+cap(words)+'.',true,ex);await say(ph+' '+cap(words)+'. '+ex);await later(600);if(alive(ui.tok))next()}
        else{tries++;d.classList.add('no','shake');sfx.bad();
          if(tries>=2){lock=true;res[r]='meh';const good=[...box.children][opts.indexOf(target)];good.classList.add('ok','pulse');
            const ex=p.hourOnly?'':explain(target);ui.fbk('Вот где '+words+'.',false,ex);await say('Смотри, вот где '+words+'. '+ex);await later(1200);if(alive(ui.tok))next()}
          else{ui.fbk('Посмотри ещё раз.',false);say('Посмотри ещё раз. Где '+words+'?')}}};
    });
    if(p.digitalOnly){ui.ask('Найди часы, на которых такое время:',fmt(target),'Найди часы, на которых такое время.')}else ui.ask('Где '+words+'?',p.digital?fmt(target):'');
  };
  next();
}

/* --- Поставь стрелки --- */
function gShow(p,title,finish){
  const ui=gameShell(title);const c=new Clock(ui.cc);const step=p.step||300;
  const base={hour:true,minute:!p.hourOnly,labels:!!p.labels,drag:p.hourOnly?{hour:3600}:{hour:step,minute:step}};

  $('#map').onclick=showMap;
  const nx=$('#nx');if(nx)nx.onclick=()=>startGame(li,gi+1);
  const nl=$('#nl');if(nl)nl.onclick=()=>showLesson(li+1);
}

/* ===================== Мастерская ===================== */
function showWorkshop(){
  const tok=go(`<div class="stage"><div class="clockcol" id="cc"></div><div>
   <div class="bubble"><div class="owl">🛠️</div><div class="txt"><div class="q" id="w1" style="font-size:28px"></div><div class="small" id="w2" style="font-size:18px;margin-top:6px"></div><div class="big" id="w3"></div></div><button class="say" id="rep">🔊</button></div>
   <div class="legend"><span style="color:var(--hour)">часовая</span><span style="color:var(--minute)">минутная</span><span style="color:var(--second)">секундная</span></div>
   <div class="row actions"><button class="btn sec sm" data-d="-3600">−1 час</button><button class="btn sec sm" data-d="3600">+1 час</button><button class="btn sec sm" data-d="-300">−5 мин</button><button class="btn sec sm" data-d="300">+5 мин</button><button class="btn sm" id="rnd">🎲 Случайно</button></div>
   <div class="tog" id="tog"><button data-k="labels">Минуты на ободе</button><button data-k="sector">Закрашивать минуты</button><button data-k="second">Секундная стрелка</button><button data-k="digital">Цифрами</button><button data-k="auto">Говорить</button></div>
   </div></div>`,'🛠️ Мастерская часов');
  const o={labels:true,sector:true,second:false,digital:true,auto:true};
  const c=new Clock($('#cc'));
  const cfg=()=>c.config({hour:true,minute:true,second:o.second,labels:o.labels,sector:o.sector?'min':false,drag:{hour:60,minute:60,second:1}});
  const upd=()=>{$('#w1').textContent=cap(timeWords(c.T));$('#w2').textContent='или: '+fullWords(c.T);$('#w3').textContent=o.digital?fmt(c.T):'';
    [...$('#tog').children].forEach(b=>b.classList.toggle('on',!!o[b.dataset.k]))};
  const speak=()=>say(cap(promptWords(c.T))+'.');
  cfg();c.set(H(3));upd();
  c.onChange=upd;c.onRelease=()=>{if(o.auto)speak()};
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await c.animTo(c.T+ +b.dataset.d,500);upd();if(o.auto)speak()});
  $('#rnd').onclick=async()=>{await c.animTo(H(rnd(12),rnd(12)*5),900);upd();if(o.auto)speak()};
  $('#rep').onclick=speak;
  $('#tog').onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;o[k]=!o[k];const T=c.T;cfg();c.set(T);upd()};
}

/* ===================== Живые часы ===================== */
function showLive(){
  go(`<div class="stage"><div class="clockcol" id="cc"></div><div>
   <div class="bubble">${mascot()}<div class="txt"><div class="small" id="per" style="font-size:20px"></div><div class="q" id="w1" style="font-size:28px"></div><div class="big" id="w3"></div></div><button class="say" id="rep">🔊</button></div>
   <div class="tog" id="tog"><button data-k="tick">Тик-так</button><button data-k="digital">Цифрами</button><button data-k="labels">Минуты на ободе</button></div>   </div></div>`,'⏱️ Живые часы');
  const o={tick:false,digital:true,labels:false};
  const c=new Clock($('#cc'));
  const now=()=>{const d=new Date();return{T:H(d.getHours(),d.getMinutes(),d.getSeconds()),h:d.getHours()}};
  const per=h=>h>=5&&h<12?['☀️ Утро','утра']:h>=12&&h<17?['🌤️ День','дня']:h>=17&&h<23?['🌙 Вечер','вечера']:['🌌 Ночь','ночи'];
  const upd=()=>{const n=now();c.set(n.T);if(o.tick)sfx.tick(n.T%2);$('#per').textContent=per(n.h)[0];
    $('#w1').textContent=cap(timeWords(n.T));$('#w3').textContent=o.digital?fmt(n.T):'';
    [...$('#tog').children].forEach(b=>b.classList.toggle('on',!!o[b.dataset.k]))};
  const cfg=()=>c.config({hour:true,minute:true,second:true,labels:o.labels});
  cfg();upd();every(upd,1000);
  $('#rep').onclick=()=>{const n=now();say('Сейчас '+promptWords(n.T)+', '+per(n.h)[0].split(' ')[1].toLowerCase()+'.')};
  $('#tog').onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;o[k]=!o[k];cfg();upd()};
}

/* ===================== Шапка ===================== */
function hdr(){$('#sndBtn').textContent=S.sound?'🔔':'🔕';$('#sndBtn').classList.toggle('off',!S.sound);$('#voiceBtn').classList.toggle('off',!S.voice)}
$('#homeBtn').onclick=showMap;
$('#sndBtn').onclick=()=>{S.sound=!S.sound;save();hdr();actx();sfx.pop()};
$('#voiceBtn').onclick=()=>{S.voice=!S.voice;save();hdr();if(!S.voice)hush();else say('Голос включён')};
hdr();showMap();
</script>
